services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hris
      HRIS_APP_DB_USER: hris_app
      HRIS_APP_DB_PASSWORD: hris_app_dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/docker/init-db.sh:/docker-entrypoint-initdb.d/10-init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://hris_app:hris_app_dev_password@postgres:5432/hris
      DATABASE_ADMIN_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/hris
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "4201:4200"
    volumes:
      - ./frontend/src:/app/src
    command: npm run start -- --host 0.0.0.0

volumes:
  postgres_data:
