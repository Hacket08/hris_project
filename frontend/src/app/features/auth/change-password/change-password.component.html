<c-container>
  <c-row class="justify-content-center w-100">
    <c-col lg="6" md="8" xl="5">
      <c-card class="p-4">
        <c-card-body class="d-flex flex-column gap-4">
          <h2 class="h5 text-center mb-0">Set a new password</h2>
          <p class="text-body-secondary text-center small mb-0">
            You must set your own password before continuing.
          </p>
          <form cForm cRow class="gy-3" (ngSubmit)="onSubmit()" #changeForm="ngForm">
            <c-col xs="12">
              <label cLabel for="currentPassword">Current password</label>
              <input
                cFormControl
                id="currentPassword"
                name="currentPassword"
                type="password"
                [(ngModel)]="currentPassword"
                required
                autocomplete="current-password"
              />
            </c-col>
            <c-col xs="12">
              <label cLabel for="newPassword">New password</label>
              <input
                cFormControl
                id="newPassword"
                name="newPassword"
                type="password"
                [(ngModel)]="newPassword"
                required
                minlength="8"
                autocomplete="new-password"
              />
            </c-col>
            <c-col xs="12">
              <label cLabel for="confirmPassword">Confirm new password</label>
              <input
                cFormControl
                id="confirmPassword"
                name="confirmPassword"
                type="password"
                [(ngModel)]="confirmPassword"
                required
                minlength="8"
                autocomplete="new-password"
              />
            </c-col>
            @if (errorMessage()) {
              <c-col xs="12">
                <p class="text-danger mb-0">{{ errorMessage() }}</p>
              </c-col>
            }
            <c-col xs="12">
              <button cButton class="w-100" color="primary" type="submit" [disabled]="changeForm.invalid || submitting()">
                {{ submitting() ? 'Saving…' : 'Set password' }}
              </button>
            </c-col>
          </form>
        </c-card-body>
      </c-card>
    </c-col>
  </c-row>
</c-container>
