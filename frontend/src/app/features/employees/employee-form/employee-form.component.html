<c-container class="py-4">
  <c-row class="justify-content-center">
    <c-col lg="8">
      <c-card>
        <c-card-body class="d-flex flex-column gap-3">
          <h2 class="h5 mb-0">Add employee</h2>
          <form cForm cRow class="gy-3" (ngSubmit)="onSubmit()" #employeeForm="ngForm">
            <c-col md="6">
              <label cLabel for="firstName">First name</label>
              <input cFormControl id="firstName" name="firstName" [(ngModel)]="firstName" required />
            </c-col>
            <c-col md="6">
              <label cLabel for="lastName">Last name</label>
              <input cFormControl id="lastName" name="lastName" [(ngModel)]="lastName" required />
            </c-col>
            <c-col md="6">
              <label cLabel for="contactInfo">Contact info</label>
              <input cFormControl id="contactInfo" name="contactInfo" [(ngModel)]="contactInfo" />
            </c-col>
            <c-col md="6">
              <label cLabel for="hireDate">Hire date</label>
              <input cFormControl id="hireDate" name="hireDate" type="date" [(ngModel)]="hireDate" required />
            </c-col>
            <c-col md="6">
              <label cLabel for="employmentStatus">Employment status</label>
              <select cSelect id="employmentStatus" name="employmentStatus" [(ngModel)]="employmentStatus" required>
                <option value="probationary">Probationary</option>
                <option value="regular">Regular</option>
                <option value="separated">Separated</option>
              </select>
            </c-col>
            <c-col md="6">
              <label cLabel for="positionId">Position</label>
              <select cSelect id="positionId" name="positionId" [(ngModel)]="positionId" required>
                <option value="" disabled selected>Select a position</option>
                @for (position of positions(); track position.id) {
                  <option [value]="position.id">{{ position.title }} ({{ position.department_name }})</option>
                }
              </select>
            </c-col>
            <c-col md="6">
              <label cLabel for="positionTitle">Job title</label>
              <input cFormControl id="positionTitle" name="positionTitle" [(ngModel)]="positionTitle" placeholder="e.g. HR Associate" />
            </c-col>
            <c-col md="6">
              <label cLabel for="regularizationDate">Regularization date</label>
              <input cFormControl id="regularizationDate" name="regularizationDate" type="date" [(ngModel)]="regularizationDate" />
            </c-col>

            <c-col xs="12"><hr class="my-1" /><p class="text-body-secondary small mb-0">Personal information (optional)</p></c-col>
            <c-col md="4">
              <label cLabel for="middleName">Middle name</label>
              <input cFormControl id="middleName" name="middleName" [(ngModel)]="middleName" />
            </c-col>
            <c-col md="4">
              <label cLabel for="suffix">Suffix</label>
              <input cFormControl id="suffix" name="suffix" [(ngModel)]="suffix" placeholder="Jr., III, etc." />
            </c-col>
            <c-col md="4">
              <label cLabel for="nickname">Nickname</label>
              <input cFormControl id="nickname" name="nickname" [(ngModel)]="nickname" />
            </c-col>
            <c-col md="4">
              <label cLabel for="maidenName">Maiden name</label>
              <input cFormControl id="maidenName" name="maidenName" [(ngModel)]="maidenName" />
            </c-col>
            <c-col md="4">
              <label cLabel for="gender">Gender</label>
              <input cFormControl id="gender" name="gender" [(ngModel)]="gender" />
            </c-col>
            <c-col md="4">
              <label cLabel for="birthdate">Birthdate</label>
              <input cFormControl id="birthdate" name="birthdate" type="date" [(ngModel)]="birthdate" />
            </c-col>
            <c-col md="6">
              <label cLabel for="birthPlace">Birth place</label>
              <input cFormControl id="birthPlace" name="birthPlace" [(ngModel)]="birthPlace" />
            </c-col>
            <c-col md="6">
              <label cLabel for="civilStatus">Civil status</label>
              <select cSelect id="civilStatus" name="civilStatus" [(ngModel)]="civilStatus">
                <option value="">— Not specified —</option>
                <option value="single">Single</option>
                <option value="married">Married</option>
                <option value="widowed">Widowed</option>
                <option value="separated">Separated</option>
                <option value="annulled">Annulled</option>
              </select>
            </c-col>
            <c-col md="6">
              <label cLabel for="spouseName">Spouse name</label>
              <input cFormControl id="spouseName" name="spouseName" [(ngModel)]="spouseName" />
            </c-col>
            <c-col md="6">
              <label cLabel for="religion">Religion</label>
              <input cFormControl id="religion" name="religion" [(ngModel)]="religion" />
            </c-col>
            <c-col md="6">
              <label cLabel for="nationality">Nationality</label>
              <input cFormControl id="nationality" name="nationality" [(ngModel)]="nationality" />
            </c-col>
            <c-col md="6">
              <label cLabel for="corporateEmail">Corporate email</label>
              <input cFormControl id="corporateEmail" name="corporateEmail" type="email" [(ngModel)]="corporateEmail" />
            </c-col>
            <c-col md="6">
              <label cLabel for="personalEmail">Personal email</label>
              <input cFormControl id="personalEmail" name="personalEmail" type="email" [(ngModel)]="personalEmail" />
            </c-col>
            <c-col md="6">
              <label cLabel for="permanentAddress">Permanent address</label>
              <input cFormControl id="permanentAddress" name="permanentAddress" [(ngModel)]="permanentAddress" />
            </c-col>
            <c-col md="6">
              <label cLabel for="currentAddress">Current address</label>
              <input cFormControl id="currentAddress" name="currentAddress" [(ngModel)]="currentAddress" />
            </c-col>
            <c-col md="6" class="d-flex align-items-center">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="isSoloParent" name="isSoloParent" [(ngModel)]="isSoloParent" />
                <label class="form-check-label" for="isSoloParent">Solo parent (RA 8972)</label>
              </div>
            </c-col>
            <c-col md="6" class="d-flex align-items-center">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="isMinimumWageEarner" name="isMinimumWageEarner" [(ngModel)]="isMinimumWageEarner" />
                <label class="form-check-label" for="isMinimumWageEarner">Minimum wage earner (TRAIN law exemption)</label>
              </div>
            </c-col>

            <c-col xs="12"><hr class="my-1" /><p class="text-body-secondary small mb-0">Government IDs (optional, encrypted at rest)</p></c-col>
            <c-col md="6">
              <label cLabel for="sssNumber">SSS number</label>
              <input cFormControl id="sssNumber" name="sssNumber" [(ngModel)]="sssNumber" />
            </c-col>
            <c-col md="6">
              <label cLabel for="philhealthNumber">PhilHealth number</label>
              <input cFormControl id="philhealthNumber" name="philhealthNumber" [(ngModel)]="philhealthNumber" />
            </c-col>
            <c-col md="6">
              <label cLabel for="pagibigNumber">Pag-IBIG number</label>
              <input cFormControl id="pagibigNumber" name="pagibigNumber" [(ngModel)]="pagibigNumber" />
            </c-col>
            <c-col md="6">
              <label cLabel for="tin">TIN</label>
              <input cFormControl id="tin" name="tin" [(ngModel)]="tin" />
            </c-col>

            @if (errorMessage()) {
              <c-col xs="12"><p class="text-danger mb-0">{{ errorMessage() }}</p></c-col>
            }
            <c-col xs="12">
              <button cButton color="primary" type="submit" [disabled]="employeeForm.invalid || submitting()">
                {{ submitting() ? 'Saving…' : 'Save' }}
              </button>
            </c-col>
          </form>
        </c-card-body>
      </c-card>
    </c-col>
  </c-row>
</c-container>
