<c-container>
  <c-row class="justify-content-center w-100">
    <c-col lg="6" md="8" xl="5">
      <c-card class="p-4">
        <c-card-body class="d-flex flex-column gap-4">
          <h2 class="h5 text-center mb-0">Enter your authenticator code</h2>
          <form cForm cRow class="gy-3" (ngSubmit)="onSubmit()" #mfaForm="ngForm">
            <c-col xs="12">
              <label cLabel for="code">6-digit code</label>
              <input
                cFormControl
                id="code"
                name="code"
                type="text"
                inputmode="numeric"
                pattern="[0-9]*"
                [(ngModel)]="code"
                required
                autocomplete="one-time-code"
              />
            </c-col>
            @if (errorMessage()) {
              <c-col xs="12">
                <p class="text-danger mb-0">{{ errorMessage() }}</p>
              </c-col>
            }
            <c-col xs="12">
              <button cButton class="w-100" color="primary" type="submit" [disabled]="mfaForm.invalid || submitting()">
                {{ submitting() ? 'Verifying…' : 'Verify' }}
              </button>
            </c-col>
          </form>
        </c-card-body>
      </c-card>
    </c-col>
  </c-row>
</c-container>
